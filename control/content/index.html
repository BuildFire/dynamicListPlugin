<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="../../../../styles/helper.css" rel="stylesheet">
	<link href="../../../../styles/control/bf-base.css" rel="stylesheet">
	<link href="../../../../styles/siteIcons.css" rel="stylesheet" />
  <link href="../../../../styles/control/siteIcons-control.css" rel="stylesheet" />
  <link href="../../../../styles/components/control/tagsInput/tagsInput.min.css" rel="stylesheet"/>

  <!-- Style -->
  <link rel="stylesheet" href="style.css">

  <!-- JS -->
  <script src="../../../../scripts/buildfire.js"></script>
  <script src="../../../../scripts/buildfire/components/control/tagsInput/tagsInput.min.js"></script>

  <script src="./js/classes/analytics.js"></script>
  <script src="./js/classes/config.js"></script>

  <script src="../../widget/js/classes/topic.js"></script>


</head>

<body>
  <div class="padding-left-twenty padding-right-twenty">
    <div class="empty-state" id="emptyListContainer">
      <h5>Loading...</h5>
    </div>
    <div class="hidden" id="contentContainer">
      <div class="row margin-bottom-twenty">
        <span class="col-md-4">Navigate To</span>
        <div class="col-md-8">
          <div class="card-container">
            <div class="img-container">
              <img class="img-holder hidden" id="pluginImage" src="" alt="" />
  
              <div class="info-container">
                <div class="info-holder">
                  <p class="title margin-bottom-five hidden" id="pluginName">Chat</p>
                  <p class="subTitle " id="pluginInstanceName">
                    Social Wall
                  </p>
                </div>
              </div>
            </div>
            <div class="DynamicRow__container-center">
              <span class="icon icon-pencil" onclick="onSelectPlugin()"></span>
              <span class="icon icon-cross2 hidden" id="deletePluginBtn" onclick="deletePlugin()"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="row margin-bottom-twenty">
        <span class="col-md-4" style="white-space: nowrap;">Selected Feature Title</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="defaultTitle" value="default" name="title" checked
              onchange="onSelectTitle('default')">
            <label for="defaultTitle" style="white-space: nowrap;">Feature Name</label>
          </div>
          <div class="radio radio-primary" style="margin-left: 30px;">
            <input type="radio" id="topicTitle" value="topic" name="title" onchange="onSelectTitle('topic')">
            <label for="topicTitle" style="white-space: nowrap;">Topic Title</label>
          </div>
        </div>
      </div>
      <div class="row margin-bottom-twenty" id="queryStringContainer">
        <span class="col-md-4">Query String</span>
        <div class="col-md-8">
          <input type="text" class="form-control"
            placeholder="?wid=${topic_id}&topic_title=${topic_title}&uid=${user_id}" id="querystring"
            onchange="onChangeQuerystring()">
          <div class="margin-top-five">
            <ul class="text-helper info-note">
              <li><strong>topic_id:</strong> The topic id</li>
              <li><strong>topic_title:</strong> The topic title</li>
              <li><strong>user_id:</strong> The user id</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="row margin-bottom-twenty">
        <span class="col-md-4">Topic Privacy</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="publicPrivacy" value="public" name="privacy" checked
              onchange="onSelectPrivacy('public')">

            <label class="col-md-5"for="publicPrivacy">
              <span class="tooltip-container">Public
                <span class="btn-info-icon btn-primary">
                  <span class="cp-tooltip top-cp-tooltip">
                    Public topics are visible to everyone using the app, including users who aren't signed in.
                  </span>
                </span>
              </span>
            </label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="privatePrivacy" value="private" name="privacy" onchange="onSelectPrivacy('private')">
            
            <label class="col-md-5"for="privatePrivacy">
              <span class="tooltip-container">Private
                <span class="btn-info-icon btn-primary">
                  <span class="cp-tooltip top-cp-tooltip left-cp-tooltip">
                    Private topics are visible only to the user who created them - no other app users can see them.
                  </span>
                </span>
              </span>
            </label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="bothPrivacy" value="both" name="privacy" checked onchange="onSelectPrivacy('both')">
            
            <label class="col-md-5"for="bothPrivacy">
              <span class="tooltip-container">Both
                <span class="btn-info-icon btn-primary">
                  <span class="cp-tooltip top-cp-tooltip left-cp-tooltip">
                    Shows public and private topics together - users see public topics from everyone alongside their own private ones.
                  </span>
                </span>
              </span>
            </label>
          </div>
        </div>
      </div>

      <div class="row margin-bottom-twenty" id="writeAccessContainer">
        <span class="col-md-4">Public Write Access</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="publicWritePrivacy" value="publicWrite" name="writePrivacy" checked
              onchange="onSelectWritePrivacy()">
            <label class="col-md-5"for="publicWritePrivacy">
              <span class="tooltip-container">Anyone
                <span class="btn-info-icon btn-primary">
                  <span class="cp-tooltip top-cp-tooltip">
                    Any app user can create topics and add content to this feed.
                  </span>
                </span>
              </span>
            </label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="privateWritePrivacy" value="privateWrite" name="writePrivacy"
              onchange="onSelectWritePrivacy()">
            <label class="col-md-5"for="privateWritePrivacy">
              <span class="tooltip-container">Tag Only
                <span class="btn-info-icon btn-primary">
                  <span class="cp-tooltip top-cp-tooltip left-cp-tooltip">
                    Only users assigned one of the selected tags can add content - everyone else can view but not post.
                  </span>
                </span>
              </span>
            </label>
          </div>
        </div>
      </div>

      <div class="row margin-bottom-twenty tagInputContainer hidden" id="tagInputContainer">
        <div class="col-md-4"></div>
        <div class="col-md-8">
          <div id="writePrivacyTagsContainer"></div>
        </div>
      </div>
      
      <div class="row margin-bottom-twenty">
        <span class="col-md-4">Style With Random</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="imageIndicator" value="image" name="indicator" checked
              onchange="onSelectIndicator()">
            <label for="imageIndicator">Images</label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="colorIndicator" value="color" name="indicator" onchange="onSelectIndicator()">
            <label for="colorIndicator">Colors</label>
          </div>
        </div>
      </div>
      <div class="row margin-bottom-twenty">
        <span class="col-md-4">Disable Groups</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="contentTypeLinks" value="links" name="content" checked
              onchange="onSelectContentType(1)">
            <label for="contentTypeLinks">On</label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="contentTypeGroups" value="groupslinks" name="content"
              onchange="onSelectContentType(2)">
            <label for="contentTypeGroups">Off</label>
          </div>
        </div>
      </div>

      <div class="row margin-bottom-twenty">
        <span class="col-md-4">Empty State Message</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="emptyStateMessageOn" value="emptyStateMessageOn" name="emptyStateMessage" checked
              onchange="onSelectEmptyStateMessage(true)">
            <label for="emptyStateMessageOn">On</label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="emptyStateMessageOff" value="emptyStateMessageOff" name="emptyStateMessage"
              onchange="onSelectEmptyStateMessage(false)">
            <label for="emptyStateMessageOff">Off</label>
          </div>
        </div>
      </div>

      <div class="row margin-bottom-twenty hidden" id="emptyStateMessageDiv">
        <div class="col-md-4"></div>
        <div class="col-md-8 flex flex-align-center">
          <input type="text" placeholder="Empty state message" class="form-control" id="blankStateMessage" onchange="onChangeEmptyStateMessage()">
        </div>
      </div>

      <div class="row margin-bottom-twenty">
        <span class="col-md-4">Sort by</span>
        <div class="col-md-8 flex space-between">
          <div class="radio radio-primary margin-top-zero">
            <input type="radio" id="sortBy0" name="sortBy" onchange="onSelectSortType(0)" checked>
            <label for="sortBy0">Natural order</label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="sortBy1" name="sortBy" onchange="onSelectSortType(1)">
            <label for="sortBy1">A-Z</label>
          </div>
          <div class="radio radio-primary">
            <input type="radio" id="sortBy2" name="sortBy" onchange="onSelectSortType(2)">
            <label for="sortBy2">Z-A</label>
          </div>
        </div>
      </div>

    </div>
    <script>
      Analytics.init();
      let config = new Config();


      init();

      function init() {
        Config.get()
          .then(result => {
            updateRecordsForSorting();
            // This way, we will keep old instances to use PSW navigate by default (so we don't break backward compatibility) and new instances to navigate to CW by default.
            if (result && !Object.keys(result.data).length) result.data.navigateToCwByDefault = true;
            config = new Config(result.data);

            if (config.querystring && config.querystring.trim() !== "") {
              querystring.value = config.querystring;
            } else {
              querystring.value = "?wid=${topic_id}&topic_title=${topic_title}&uid=${user_id}"
            }

            initWritePrivacyTagsInput();


            if (result && Object.keys(config.pluginData).length > 0) {
              getPluginInstance(config.pluginData.instanceId).then(pluginInstance => {
                  if(pluginInstance && pluginInstance.title !== config.pluginData.title) {
                    config.pluginData.title = pluginInstance.title;
                    config.save();
                  }
                  pluginName.classList.remove("hidden");
                  pluginImage.classList.remove("hidden");
                  deletePluginBtn.classList.remove("hidden");
                  pluginName.innerHTML = config.pluginData.pluginTypeName;
                  pluginInstanceName.innerHTML = config.pluginData.title;
                  pluginImage.src = config.pluginData.iconUrl;

                  queryStringContainer.style.display = "block"
              });
            } else {
              pluginName.classList.add("hidden");
              pluginImage.classList.add("hidden");
              deletePluginBtn.classList.add("hidden");
              pluginInstanceName.innerHTML = 'Social Wall'
              queryStringContainer.style.display = "none"
            }
            if (config.featureTitle === Config.TITLE.DEFAULT) {
              defaultTitle.checked = true;
            } else {
              topicTitle.checked = true;
            }
            if (config.privacy === Config.PRIVACY.PUBLIC) {
              publicPrivacy.checked = true;
              writeAccessContainer.style.display = "block";
              tagInputContainer.style.display = "block";
            }
            else if (config.privacy === Config.PRIVACY.PRIVATE) {
              writeAccessContainer.style.display = "none";
              tagInputContainer.style.display = "none";
              privatePrivacy.checked = true;
            } else {
              bothPrivacy.checked = true;
            }

            if (config.contentType === 1) {
              contentTypeLinks.checked = true;
            } else {
              contentTypeGroups.checked = true;
            }

            if (config.indicator === Config.INDICATOR.IMAGE) {
              imageIndicator.checked = true;
            } else {
              colorIndicator.checked = true;
            }

            if(config?.sortBy === Config.SORTING.ASCENDING) {
              sortBy1.checked = true;
            } else if(config?.sortBy === Config.SORTING.DESCENDING) {
              sortBy2.checked = true;
            }

            if (config.emptyState) {
              emptyStateMessageOn.checked = true;
              blankStateMessage.value = config.emptyStateMessage;
              emptyStateMessageDiv.classList.remove("hidden");
            } else {
              emptyStateMessageDiv.classList.add("hidden");
              emptyStateMessageOff.checked = true;
            }

            if (config.writePrivacy === Config.WRITE_PRIVACY.PRIVATE) {
              privateWritePrivacy.checked = true;
              tagInputContainer.classList.remove("hidden");
            }
            else {
              publicWritePrivacy.checked = true;
              tagInputContainer.classList.add("hidden");
            }

            setTimeout(() => {
              emptyListContainer.classList.add("hidden");
              contentContainer.classList.remove("hidden");
            }, 500);
          })
          .catch(err => {
            console.error(err)
            setTimeout(() => {
              emptyListContainer.classList.add("hidden");
              contentContainer.classList.remove("hidden");
            }, 500);
          })
      }

      function getPluginInstance (instanceId) {
        return new Promise((resolve, reject) => {
          if(!instanceId) resolve(null);
          buildfire.pluginInstance.get(instanceId, function(error, instance) {
              if (instance) {
                resolve(instance);
              } else {
                resolve(null);
              }
          });
        });
      }

      function setBothPrivacyElements() {
        if (config.writePrivacy === Config.WRITE_PRIVACY.PRIVATE) {
          config.writePrivacy = Config.WRITE_PRIVACY.PUBLIC;
          tagInputContainer.classList.add("hidden");
        }
        else {
          config.writePrivacy = Config.WRITE_PRIVACY.PRIVATE;
          tagInputContainer.classList.remove("hidden");
        }
      }

      function onSelectPlugin() {
        buildfire.pluginInstance.showDialog({}, (error, instances) => {
          if (instances && instances.length > 0) {
            config.pluginData = instances[0];
            config.save();
            pluginName.classList.remove("hidden");
            pluginImage.classList.remove("hidden");
            deletePluginBtn.classList.remove("hidden");
            pluginImage.src = instances[0].iconUrl;
            pluginName.innerHTML = instances[0].pluginTypeName;
            pluginInstanceName.innerHTML = instances[0].title;
            queryStringContainer.style.display = "block";
          }
        });
      }

      function deletePlugin() {
        config.pluginData = {};
        config.save();
        pluginName.classList.add("hidden");
        pluginImage.classList.add("hidden");
        deletePluginBtn.classList.add("hidden");
        pluginImage.src = '';
        pluginInstanceName.innerHTML = 'Social Wall';
        queryStringContainer.style.display = "none";
      }

      function onSelectEmptyStateMessage(bool) {
        if (bool) {
          emptyStateMessageDiv.classList.remove("hidden");
          blankStateMessage.value = config.emptyStateMessage;
        }
        else if (!bool)
          emptyStateMessageDiv.classList.add("hidden");

        config.emptyState = bool;
        config.save();
      }

      function onSelectContentType(type) {
        config.contentType = type;
        config.save();
      }

      function onSelectPrivacy(privacy) {
        if (privacy === 'public') {
          config.privacy = Config.PRIVACY.PUBLIC;
          writeAccessContainer.style.display = "block";
        }
        else if (privacy === 'private') {
          config.privacy = Config.PRIVACY.PRIVATE;
          writeAccessContainer.style.display = "none";
        }
        else if (privacy === 'both') {
          config.privacy = Config.PRIVACY.BOTH;
          writeAccessContainer.style.display = "block";
        }
        if ((privacy === 'public' || privacy === 'both') && config.writePrivacy === Config.WRITE_PRIVACY.PRIVATE) {
          tagInputContainer.classList.remove("hidden");
        } else {
          tagInputContainer.classList.add("hidden");
        }
        config.save();
      }

      function onSelectTitle(title) {
        if (title === 'default') {
          config.featureTitle = Config.TITLE.DEFAULT;
        }
        else if (title === 'topic') {
          config.featureTitle = Config.TITLE.TOPIC;
        }
        config.save();
      }

      function onSelectWritePrivacy() {
        setBothPrivacyElements();
        config.save();
      }


      function onSelectIndicator() {
        if (imageIndicator.checked) {
          config.indicator = Config.INDICATOR.IMAGE;
        } else {
          config.indicator = Config.INDICATOR.COLOR;
        }
        config.save();
      }

      function initWritePrivacyTagsInput() {
        const writePrivacyTagsInput = new buildfire.components.control.userTagsInput('#writePrivacyTagsContainer', {
          languageSettings: { placeholder: 'Select Tag(s)' }
        });

        // Seed the previously saved tags without triggering a redundant save.
        writePrivacyTagsInput.onUpdate = () => {};
        let initialTags = (config.writePrivacyTag || '')
          .split(',')
          .map(tag => tag.trim())
          .filter(Boolean)
          .map(tag => ({ value: tag, tagName: tag }));
        if (initialTags.length) writePrivacyTagsInput.set(initialTags);

        writePrivacyTagsInput.onUpdate = ({ tags }) => {
          config.writePrivacyTag = tags.map(tag => tag.value).join(', ');
          config.save();
        };
      }

      function onChangeEmptyStateMessage() {
        config.emptyStateMessage = blankStateMessage.value;
        config.save();
      }

      function onChangeQuerystring() {
        config.querystring = querystring.value;
        config.save();
      }

      function onSelectSortType(sort) {
        let sortType = sort === 0 ? 'default' : sort === 1 ? 'ascending' : 'descending';
        config.sortBy = sortType;
        config.save();
      }

      function updateRecordsForSorting() {
        let hasRecords = false;
        update();

        function updateDone() {
          console.log("GOTOVO AAAAA")
          buildfire.notifications.alert({
            title: "Update Finished",
            message: `Your feature has been successfully updated! Please PUBLISH your app to see this update on mobile devices.`,
            okButton: { text: 'Ok' }
          }, function (e, data) {
            if (e) console.error(e);
          });
        }

        function update() {
          let pageSize = 50, page = 0, allItems = [], filter = { "$json.titleIndex": { $exists: false } }
          let get = function () {
            buildfire.publicData.search({ filter, pageSize, page, recordCount: true }, "topics", function (err, data) {
              console.log("EEEEEEEEEEEEEEEE", data)
              if (data && data.result && data.result.length) {
                console.log("AAAAAAAAAAAAA", hasRecords)

                buildfire.notifications.alert({
                  title: "Update In Progress",
                  message: `We have made an update to allow you to sort items alphabetically. For this update to occur successfully, please stay on this screen for 5 to 20 seconds until you receive an “Update Finished” message.`,
                  okButton: { text: 'Ok' }
                }, () => { });

                allItems = allItems.concat(data.result);
                if (data.totalRecord > allItems.length) {
                  page++;
                  get();
                }
                else {
                  let count = 0;
                  allItems.map(item => {
                    item.data.titleIndex = item.data.title.toLowerCase();
                    console.log("RADI UPDATE", item)
                    buildfire.publicData.update(item.id, item.data, "topics", (err, res) => {
                      console.log(res)
                      count++;
                      if (count === allItems.length) {
                        updateDone()
                        console.log("PROSO UPDATE")
                      }
                    })
                  });
                }
              }
            })
          }
          get();
        }
      }

    </script>
</body>

</html>
